# Reusable vars
x-var:
  - &POSTGRES_USER postgres
  - &POSTGRES_PASSWORD default
  - &POSTGRES_DATABASE postgres
  - &node-image node:22

# Reusable envars for postgres
x-postgres-vars: &postgres-vars
  POSTGRES_HOST: database
  POSTGRES_USER: *POSTGRES_USER
  POSTGRES_PASSWORD: *POSTGRES_PASSWORD
  POSTGRES_DATABASE: *POSTGRES_DATABASE

services:
  database:
    image: postgis/postgis:17-3.4 # if using crunchy , make sure to align with crunchy version, currently it is at 16 and postgis 3.3
    container_name: database
    environment:
      <<: *postgres-vars
    healthcheck:
      test: ["CMD", "pg_isready", "-U", *POSTGRES_USER]
    ports: ["5432:5432"]

  migrations:
    image: flyway/flyway:12-alpine
    container_name: migrations
    command: info migrate info
    volumes: ["./migrations/sql:/flyway/sql:ro"]
    environment:
      FLYWAY_URL: jdbc:postgresql://database:5432/postgres
      FLYWAY_USER: *POSTGRES_USER
      FLYWAY_PASSWORD: *POSTGRES_PASSWORD
      FLYWAY_BASELINE_ON_MIGRATE: true
      FLYWAY_DEFAULT_SCHEMA: widgets
    depends_on:
      database:
        condition: service_healthy

  schemaspy:
    image: schemaspy/schemaspy:7.0.2
    profiles: ["schemaspy"]
    container_name: schemaspy
    command: -t pgsql11 -db postgres -host database -port 5432 -u postgres -p default -schemas widgets
    depends_on:
      migrations:
        condition: service_completed_successfully
    volumes: ["./output:/output"]

  provider-api:
    container_name: provider-api
    depends_on:
      migrations:
        condition: service_completed_successfully
    entrypoint: sh -c "npm i && npm run start:dev"
    environment:
      <<: *postgres-vars
      NODE_ENV: development
      PROVIDER_API_ALLOWED_CLIENT_IDS: ${PROVIDER_API_ALLOWED_CLIENT_IDS:?PROVIDER_API_ALLOWED_CLIENT_IDS is required. Run scripts/setup-keycloak.mjs and use the generated env file.}
      OIDC_AUTHORITY: ${OIDC_AUTHORITY:?OIDC_AUTHORITY is required. Run scripts/setup-keycloak.mjs and use the generated env file.}
      OIDC_OPENID_CONNECT_URL: ${OIDC_OPENID_CONNECT_URL:-}
      JWT_ISSUER: ${PROVIDER_API_JWT_ISSUER:?PROVIDER_API_JWT_ISSUER is required. Run scripts/setup-keycloak.mjs and use the generated env file.}
      JWT_VALIDATE_SIGNATURE: ${PROVIDER_API_JWT_VALIDATE_SIGNATURE:-true}
      JWT_VALIDATE_EXPIRY: ${PROVIDER_API_JWT_VALIDATE_EXPIRY:-true}
      PUBLIC_BASE_PATH: ${PROVIDER_API_PUBLIC_BASE_PATH:-}
      SWAGGER_OAUTH_CLIENT_ID: ${PROVIDER_API_SWAGGER_OAUTH_CLIENT_ID:?PROVIDER_API_SWAGGER_OAUTH_CLIENT_ID is required. Run scripts/setup-keycloak.mjs and use the generated env file.}
      SWAGGER_OAUTH_REDIRECT_URL: ${PROVIDER_API_SWAGGER_OAUTH_REDIRECT_URL:?PROVIDER_API_SWAGGER_OAUTH_REDIRECT_URL is required. Run scripts/setup-keycloak.mjs and use the generated env file.}
      SWAGGER_OAUTH_SCOPES: ${PROVIDER_API_SWAGGER_OAUTH_SCOPES:?PROVIDER_API_SWAGGER_OAUTH_SCOPES is required. Run scripts/setup-keycloak.mjs and use the generated env file.}
    image: *node-image
    ports: ["3002:3000"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3000/api/health"]
    working_dir: "/app"
    volumes:
      - "./provider-api:/app"
      - "/app/node_modules"
      - "/app/src/generated"
      - "/app/dist"

  provider-sdx-api:
    container_name: provider-sdx-api
    depends_on:
      provider-api:
        condition: service_healthy
    entrypoint: sh -c "npm i && npm run start:dev"
    environment:
      NODE_ENV: development
      PROVIDER_API_BASE_URL: ${PROVIDER_API_BASE_URL:-http://provider-api:3000/api/v1}
      PROVIDER_API_CLIENT_ID: ${PROVIDER_API_CLIENT_ID:?PROVIDER_API_CLIENT_ID is required. Run scripts/setup-keycloak.mjs and use the generated env file.}
      PROVIDER_API_CLIENT_SECRET: ${PROVIDER_API_CLIENT_SECRET:?PROVIDER_API_CLIENT_SECRET is required. Run scripts/setup-keycloak.mjs and use the generated env file.}
      PROVIDER_API_TOKEN_SCOPE: ${PROVIDER_API_TOKEN_SCOPE:-}
      PROVIDER_API_TOKEN_URL: ${PROVIDER_API_TOKEN_URL:-}
      OIDC_AUTHORITY: ${OIDC_AUTHORITY:?OIDC_AUTHORITY is required. Run scripts/setup-keycloak.mjs and use the generated env file.}
      OIDC_OPENID_CONNECT_URL: ${OIDC_OPENID_CONNECT_URL:-}
      JWT_ISSUER: ${PROVIDER_SDX_API_JWT_ISSUER:-}
      JWT_VALIDATE_SIGNATURE: ${PROVIDER_SDX_API_JWT_VALIDATE_SIGNATURE:-false}
      JWT_VALIDATE_EXPIRY: ${PROVIDER_SDX_API_JWT_VALIDATE_EXPIRY:-false}
      PUBLIC_BASE_PATH: ${PROVIDER_SDX_API_PUBLIC_BASE_PATH:-}
      SWAGGER_OAUTH_CLIENT_ID: ${PROVIDER_SDX_API_SWAGGER_OAUTH_CLIENT_ID:?PROVIDER_SDX_API_SWAGGER_OAUTH_CLIENT_ID is required. Run scripts/setup-keycloak.mjs and use the generated env file.}
      SWAGGER_OAUTH_REDIRECT_URL: ${PROVIDER_SDX_API_SWAGGER_OAUTH_REDIRECT_URL:?PROVIDER_SDX_API_SWAGGER_OAUTH_REDIRECT_URL is required. Run scripts/setup-keycloak.mjs and use the generated env file.}
      SWAGGER_OAUTH_SCOPES: ${PROVIDER_SDX_API_SWAGGER_OAUTH_SCOPES:?PROVIDER_SDX_API_SWAGGER_OAUTH_SCOPES is required. Run scripts/setup-keycloak.mjs and use the generated env file.}
    image: *node-image
    ports: ["3003:3000"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3000/api/health"]
    working_dir: "/app"
    volumes:
      - "./provider-sdx-api:/app"
      - "/app/node_modules"
      - "/app/dist"

  bff:
    container_name: bff
    depends_on:
      provider-sdx-api:
        condition: service_healthy
    entrypoint: sh -c "npm i && npm run start:dev"
    environment:
      NODE_ENV: development
      PROVIDER_SDX_API_BASE_URL: ${PROVIDER_SDX_API_BASE_URL:-http://provider-sdx-api:3000/api/v1}
      OIDC_AUTHORITY: ${OIDC_AUTHORITY:?OIDC_AUTHORITY is required. Run scripts/setup-keycloak.mjs and use the generated env file.}
      OIDC_CLIENT_ID: ${BFF_OIDC_CLIENT_ID:?BFF_OIDC_CLIENT_ID is required. Run scripts/setup-keycloak.mjs and use the generated env file.}
      OIDC_CLIENT_SECRET: ${BFF_OIDC_CLIENT_SECRET:?BFF_OIDC_CLIENT_SECRET is required. Run scripts/setup-keycloak.mjs and use the generated env file.}
      OIDC_DISPLAY_NAME_CLAIM: ${BFF_OIDC_DISPLAY_NAME_CLAIM:-name}
      OIDC_OPENID_CONNECT_URL: ${OIDC_OPENID_CONNECT_URL:-}
      OIDC_REDIRECT_URI: ${BFF_OIDC_REDIRECT_URI:?BFF_OIDC_REDIRECT_URI is required. Run scripts/setup-keycloak.mjs and use the generated env file.}
      OIDC_SCOPE: ${BFF_OIDC_SCOPE:?BFF_OIDC_SCOPE is required. Run scripts/setup-keycloak.mjs and use the generated env file.}
      PUBLIC_BASE_PATH: ${BFF_PUBLIC_BASE_PATH:-}
    image: *node-image
    ports: ["3001:3000"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3000/api/health"]
    working_dir: "/app"
    volumes:
      - "./bff:/app"
      - "/app/node_modules"
      - "/app/build"

  frontend:
    container_name: frontend
    entrypoint: sh -c "npm ci --ignore-scripts && npm run dev"
    environment:
      BFF_BASE_URL: ${BFF_BASE_URL:-http://bff:3000}
      PORT: 3000
      NODE_ENV: development
    image: *node-image
    ports: ["3000:3000"]
    volumes: ["./frontend:/app", "/app/node_modules"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3000"]
    working_dir: "/app"
    depends_on:
      bff:
        condition: service_healthy

  caddy:
    container_name: caddy
    profiles: ["caddy"]
    build: ./frontend
    environment:
      NODE_ENV: development
      PORT: 3000
      BFF_BASE_URL: ${BFF_BASE_URL:-http://bff:3000}
      LOG_LEVEL: info
    ports: ["3005:3000"]
    volumes: ["./frontend/Caddyfile:/etc/caddy/Caddyfile"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3000/health"]
    depends_on:
      bff:
        condition: service_healthy
