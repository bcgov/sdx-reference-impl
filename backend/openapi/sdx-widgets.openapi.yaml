openapi: 3.0.3
info:
  title: SDX Reference Implementation API - SDX Widgets
  version: 0.1.0
  description: >
    Reference Resource Server API for managing SDX Widgets.

    Normal user endpoints derive widget ownership from the authenticated subject in the JWT `sub`
    claim. Callers cannot set or change the subject through user-facing paths or request bodies.

    Authorization is layered. OAuth2 scopes authorize the client/token to invoke API operations,
    while the Resource Server separately enforces subject, tenant, resource ownership, delegation,
    role, ACL, or policy-based access rules.

    Scope names use the format `<PrivacyZone>.<resource-type>.<action>`. For this reference
    implementation, the privacy zone is `SDX-RI`, the resource type is `sdx-widgets`, and standard
    actions are `read`, `create`, `update`, and `delete`. Administrative operations are consolidated
    under the `admin` action.

    The SDX Widget scopes are `SDX-RI.sdx-widgets.read`, `SDX-RI.sdx-widgets.create`,
    `SDX-RI.sdx-widgets.update`, `SDX-RI.sdx-widgets.delete`, and `SDX-RI.sdx-widgets.admin`.

    Future implementations may use CSTAR as an authorization facts provider and a policy engine as a
    policy decision point, with the Resource Server remaining the policy enforcement point.
  contact:
    name: SDX Reference Implementation Maintainers
  license:
    name: Apache-2.0
servers:
  - url: http://localhost:3000/api/v1
    description: Local development server for the SDX Widgets API
tags:
  - name: Admin SDX Widgets
    description: Administrative SDX Widget operations that can act across subjects.
  - name: SDX Widgets
    description: SDX Widget operations that act on resources owned by the authenticated subject.
security:
  - oidc:
      - SDX-RI.sdx-widgets.read
paths:
  /sdx-widgets:
    summary: Manage SDX Widgets for the authenticated subject.
    parameters:
      - $ref: '#/components/parameters/WidgetStatusFilter'
      - $ref: '#/components/parameters/WidgetNameFilter'
      - $ref: '#/components/parameters/WidgetLimit'
      - $ref: '#/components/parameters/WidgetCursor'
      - $ref: '#/components/parameters/WidgetSortBy'
      - $ref: '#/components/parameters/WidgetSortOrder'
    get:
      tags:
        - SDX Widgets
      operationId: listSdxWidgets
      summary: List SDX Widgets owned by the authenticated subject.
      description: Returns the SDX Widgets owned by the authenticated subject identified by the JWT sub claim.
      security:
        - oidc:
            - SDX-RI.sdx-widgets.read
      responses:
        '200':
          description: The list of SDX Widgets owned by the authenticated subject.
          content:
            application/json:
              example:
                items:
                  - id: 4f3066e8-5a59-4fc5-8e7b-fcd7f4d01c4f
                    subject: user-123
                    name: Intake form
                    description: Widget used for intake workflow testing.
                    status: active
                    metadata:
                      source: local-dev
                    createdAt: '2026-05-13T18:00:00Z'
                    updatedAt: '2026-05-13T18:00:00Z'
                nextCursor: null
              schema:
                $ref: '#/components/schemas/SdxWidgetListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
        - SDX Widgets
      operationId: createSdxWidget
      summary: Create a SDX Widget for the authenticated subject.
      description:
        Creates a new SDX Widget for the authenticated subject. The service identifies the
        subject from the JWT `sub` claim rather than from the request body.
      security:
        - oidc:
            - SDX-RI.sdx-widgets.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSdxWidgetRequest'
      responses:
        '201':
          description: The created SDX Widget for the authenticated subject.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SdxWidget'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /sdx-widgets/{widgetId}:
    summary: Manage one SDX Widget for the authenticated subject.
    parameters:
      - $ref: '#/components/parameters/WidgetId'
    get:
      tags:
        - SDX Widgets
      operationId: getSdxWidget
      summary: Get a SDX Widget owned by the authenticated subject.
      description:
        Returns the SDX Widget when it is owned by the authenticated subject. Responds with 404
        when the widget does not exist or is owned by another subject.
      security:
        - oidc:
            - SDX-RI.sdx-widgets.read
      responses:
        '200':
          description: The requested SDX Widget.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SdxWidget'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
        - SDX Widgets
      operationId: replaceSdxWidget
      summary: Replace a SDX Widget for the authenticated subject.
      description:
        Replaces the SDX Widget when it is owned by the authenticated subject. The service
        identifies the subject from the JWT `sub` claim rather than from the request body.
      security:
        - oidc:
            - SDX-RI.sdx-widgets.update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSdxWidgetRequest'
      responses:
        '200':
          description: The replaced SDX Widget.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SdxWidget'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
        - SDX Widgets
      operationId: updateSdxWidget
      summary: Partially update a SDX Widget for the authenticated subject.
      description:
        Applies a partial update to the SDX Widget when it is owned by the authenticated subject.
        The service identifies the subject from the JWT `sub` claim rather than from the request
        body.
      security:
        - oidc:
            - SDX-RI.sdx-widgets.update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchSdxWidgetRequest'
      responses:
        '200':
          description: The updated SDX Widget.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SdxWidget'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
        - SDX Widgets
      operationId: deleteSdxWidget
      summary: Delete a SDX Widget owned by the authenticated subject.
      description:
        Deletes the SDX Widget when it is owned by the authenticated subject. Responds with 404
        when the widget does not exist or is owned by another subject.
      security:
        - oidc:
            - SDX-RI.sdx-widgets.delete
      responses:
        '204':
          description: The SDX Widget was deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/subjects/{subject}/sdx-widgets:
    summary: Administer SDX Widgets for one subject.
    parameters:
      - $ref: '#/components/parameters/Subject'
      - $ref: '#/components/parameters/WidgetStatusFilter'
      - $ref: '#/components/parameters/WidgetNameFilter'
      - $ref: '#/components/parameters/WidgetLimit'
      - $ref: '#/components/parameters/WidgetCursor'
      - $ref: '#/components/parameters/WidgetSortBy'
      - $ref: '#/components/parameters/WidgetSortOrder'
    get:
      tags:
        - Admin SDX Widgets
      operationId: adminListSubjectSdxWidgets
      summary: List SDX Widgets for a subject.
      description:
        Returns the SDX Widgets owned by the subject identified in the path. This operation
        requires the SDX-RI.sdx-widgets.admin scope.
      security:
        - oidc:
            - SDX-RI.sdx-widgets.admin
      responses:
        '200':
          description: The list of SDX Widgets owned by the requested subject.
          content:
            application/json:
              example:
                items:
                  - id: 4f3066e8-5a59-4fc5-8e7b-fcd7f4d01c4f
                    subject: user-123
                    name: Intake form
                    description: Widget used for intake workflow testing.
                    status: active
                    metadata:
                      source: local-dev
                    createdAt: '2026-05-13T18:00:00Z'
                    updatedAt: '2026-05-13T18:00:00Z'
                nextCursor: null
              schema:
                $ref: '#/components/schemas/SdxWidgetListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
        - Admin SDX Widgets
      operationId: adminCreateSubjectSdxWidget
      summary: Create a SDX Widget for a subject.
      description:
        Creates a new SDX Widget for the subject identified in the path. This operation requires
        the SDX-RI.sdx-widgets.admin scope.
      security:
        - oidc:
            - SDX-RI.sdx-widgets.admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSdxWidgetRequest'
      responses:
        '201':
          description: The created SDX Widget for the requested subject.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SdxWidget'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/sdx-widgets/{widgetId}:
    summary: Administer one SDX Widget by ID.
    parameters:
      - $ref: '#/components/parameters/WidgetId'
    get:
      tags:
        - Admin SDX Widgets
      operationId: adminGetSdxWidget
      summary: Get any SDX Widget by ID.
      description:
        Returns the SDX Widget identified by the path parameter across all subjects. This
        operation requires the SDX-RI.sdx-widgets.admin scope.
      security:
        - oidc:
            - SDX-RI.sdx-widgets.admin
      responses:
        '200':
          description: The requested SDX Widget.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SdxWidget'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
        - Admin SDX Widgets
      operationId: adminReplaceSdxWidget
      summary: Replace any SDX Widget by ID.
      description:
        Replaces the SDX Widget identified by the path parameter across all subjects. Subject
        transfer is allowed only on this administrative operation.
      security:
        - oidc:
            - SDX-RI.sdx-widgets.admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUpdateSdxWidgetRequest'
      responses:
        '200':
          description: The replaced SDX Widget.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SdxWidget'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
        - Admin SDX Widgets
      operationId: adminUpdateSdxWidget
      summary: Partially update any SDX Widget by ID.
      description:
        Applies a partial update to the SDX Widget identified by the path parameter across all
        subjects. Subject transfer is allowed only on this administrative operation.
      security:
        - oidc:
            - SDX-RI.sdx-widgets.admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminPatchSdxWidgetRequest'
      responses:
        '200':
          description: The updated SDX Widget.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SdxWidget'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
        - Admin SDX Widgets
      operationId: adminDeleteSdxWidget
      summary: Delete any SDX Widget by ID.
      description:
        Deletes the SDX Widget identified by the path parameter across all subjects. This
        operation requires the SDX-RI.sdx-widgets.admin scope.
      security:
        - oidc:
            - SDX-RI.sdx-widgets.admin
      responses:
        '204':
          description: The SDX Widget was deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    oidc:
      type: oauth2
      description: >
        OIDC/OAuth2 bearer token security. Placeholder URLs must be configured for the SDX/Common
        SSO issuer in each environment. Discovery URL:
        https://oidc.example.gov.bc.ca/.well-known/openid-configuration.
      flows:
        authorizationCode:
          authorizationUrl: https://oidc.example.gov.bc.ca/oauth2/authorize
          tokenUrl: https://oidc.example.gov.bc.ca/oauth2/token
          scopes:
            SDX-RI.sdx-widgets.read: Read SDX Widgets for the authenticated subject.
            SDX-RI.sdx-widgets.create: Create SDX Widgets for the authenticated subject.
            SDX-RI.sdx-widgets.update: Update SDX Widgets for the authenticated subject.
            SDX-RI.sdx-widgets.delete: Delete SDX Widgets for the authenticated subject.
            SDX-RI.sdx-widgets.admin: Administer SDX Widgets across subjects.
  parameters:
    WidgetId:
      name: widgetId
      in: path
      required: true
      description: Unique widget identifier as a UUID.
      schema:
        type: string
        format: uuid
        example: 4f3066e8-5a59-4fc5-8e7b-fcd7f4d01c4f
    Subject:
      name: subject
      in: path
      required: true
      description: Owner subject identifier.
      schema:
        type: string
        minLength: 1
        maxLength: 255
        example: user-123
    WidgetStatusFilter:
      name: status
      in: query
      required: false
      description: Filter widgets by lifecycle status.
      schema:
        $ref: '#/components/schemas/SdxWidgetStatus'
    WidgetNameFilter:
      name: name
      in: query
      required: false
      description: Case-insensitive partial name match.
      schema:
        type: string
        minLength: 1
        maxLength: 200
        example: intake
    WidgetLimit:
      name: limit
      in: query
      required: false
      description: Maximum number of widgets to return.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
        example: 25
    WidgetCursor:
      name: cursor
      in: query
      required: false
      description: Opaque pagination cursor from the previous response.
      schema:
        type: string
        example: eyJvZmZzZXQiOjI1fQ
    WidgetSortBy:
      name: sortBy
      in: query
      required: false
      description: Field used to sort results.
      schema:
        type: string
        enum:
          - createdAt
          - updatedAt
          - name
          - status
        default: createdAt
        example: createdAt
    WidgetSortOrder:
      name: sortOrder
      in: query
      required: false
      description: Sort direction for the selected sort field.
      schema:
        type: string
        enum:
          - asc
          - desc
        default: desc
        example: desc
  responses:
    BadRequest:
      description: Malformed request syntax, invalid JSON, or invalid path/query parameter format.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetailResponse'
          example:
            detail: widgetId must be a valid UUID
            errors:
              - code: INVALID_REQUEST
                location: path
                message: widgetId must be a valid UUID
                pointer: '#/widgetId'
                received: not-a-uuid
                type: tag:request-error
            status: 400
            title: Bad Request
            type: tag:request-errors
    UnprocessableEntity:
      description: Syntactically valid request failed Widget validation or database limit rules.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetailResponse'
          example:
            detail: name must be a non-empty string up to 200 characters
            errors:
              - code: VALIDATION_FAILED
                location: body
                message: name must be a non-empty string up to 200 characters
                pointer: '#/name'
                received: ''
                type: tag:semantic-validation-error
            status: 422
            title: Unprocessable Entity
            type: tag:semantic-validation-errors
    Unauthorized:
      description: Missing or invalid authentication.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Authenticated caller does not have the required scope.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Widget was not found for the current request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    SdxWidgetStatus:
      description: Lifecycle status for a widget.
      type: string
      example: active
      enum:
        - active
        - inactive
        - archived
    SdxWidget:
      description: Widget resource owned by a subject.
      type: object
      example:
        id: 4f3066e8-5a59-4fc5-8e7b-fcd7f4d01c4f
        subject: user-123
        name: Intake form
        description: Widget used for intake workflow testing.
        status: active
        metadata:
          source: local-dev
        createdAt: '2026-05-13T18:00:00Z'
        updatedAt: '2026-05-13T18:00:00Z'
      required:
        - id
        - subject
        - name
        - description
        - status
        - metadata
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        subject:
          type: string
          readOnly: true
          description: Owner subject from the JWT sub claim or admin path.
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          nullable: true
          maxLength: 1000
        status:
          $ref: '#/components/schemas/SdxWidgetStatus'
        metadata:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
    SdxWidgetListResponse:
      description: A paginated list of SDX Widgets with an optional cursor for the next page.
      type: object
      example:
        items:
          - id: 4f3066e8-5a59-4fc5-8e7b-fcd7f4d01c4f
            subject: user-123
            name: Intake form
            description: Widget used for intake workflow testing.
            status: active
            metadata:
              source: local-dev
            createdAt: '2026-05-13T18:00:00Z'
            updatedAt: '2026-05-13T18:00:00Z'
        nextCursor: eyJvZmZzZXQiOjI1fQ
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SdxWidget'
        nextCursor:
          type: string
          nullable: true
          description: Cursor to retrieve the next page, or null when there are no more results.
    CreateSdxWidgetRequest:
      description: >
        Request body for creating a widget. Subject is never accepted here.
        If status is omitted, the service creates the widget with status `active`.
        If metadata is omitted, the service stores an empty metadata object.
      type: object
      example:
        name: Intake form
        description: Widget used for intake workflow testing.
        status: active
        metadata:
          source: local-dev
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          nullable: true
          maxLength: 1000
        status:
          $ref: '#/components/schemas/SdxWidgetStatus'
        metadata:
          type: object
          additionalProperties: true
    UpdateSdxWidgetRequest:
      description: >
        Request body for replacing a widget. Subject is never accepted here.
        This is a full replacement. Omitted optional fields are reset to their default values:
        description is set to null, status is set to active, and metadata is set to an empty object.
      type: object
      example:
        name: Intake form v2
        description: Updated widget used for intake workflow testing.
        status: inactive
        metadata:
          source: local-dev
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          nullable: true
          maxLength: 1000
        status:
          $ref: '#/components/schemas/SdxWidgetStatus'
        metadata:
          type: object
          additionalProperties: true
    PatchSdxWidgetRequest:
      description: >
        Request body for partially updating a widget. Subject is never accepted here.
        Omitted fields preserve their existing values.
      type: object
      example:
        status: archived
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          nullable: true
          maxLength: 1000
        status:
          $ref: '#/components/schemas/SdxWidgetStatus'
        metadata:
          type: object
          additionalProperties: true
    AdminUpdateSdxWidgetRequest:
      description: >
        Request body for replacing a widget through an admin endpoint.
        This is a full replacement for widget fields. Omitted optional fields are reset to their
        default values: description is set to null, status is set to active, and metadata is set
        to an empty object. If subject is omitted, the existing subject is preserved.
      type: object
      example:
        subject: user-456
        name: Intake form v2
        description: Updated widget used for intake workflow testing.
        status: inactive
        metadata:
          source: local-dev
      additionalProperties: false
      required:
        - name
      properties:
        subject:
          type: string
          minLength: 1
          maxLength: 255
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          nullable: true
          maxLength: 1000
        status:
          $ref: '#/components/schemas/SdxWidgetStatus'
        metadata:
          type: object
          additionalProperties: true
    AdminPatchSdxWidgetRequest:
      description: >
        Request body for partially updating a widget through an admin endpoint.
        Omitted fields preserve their existing values. If subject is included, the administrative
        operation may transfer ownership to a different subject.
      type: object
      example:
        subject: user-456
        status: archived
      additionalProperties: false
      minProperties: 1
      properties:
        subject:
          type: string
          minLength: 1
          maxLength: 255
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          nullable: true
          maxLength: 1000
        status:
          $ref: '#/components/schemas/SdxWidgetStatus'
        metadata:
          type: object
          additionalProperties: true
    ErrorResponse:
      title: ErrorResponse
      description: >-
        Standard error response format for unexpected or server-side errors (e.g., 500 Internal
        Server Error, 403 Forbidden, 401 Unauthorized, etc.). This is used when a more structured
        Problem Details response (RFC 9457) is not appropriate or when the error is general rather
        than validation-specific.
      type: object
      example:
        error: forbidden
        message: You are not authorized to access this resource
        details:
          correlationId: req-abc123-xyz
      required:
        - error
        - message
      properties:
        error:
          type: string
          title: Error
          description: >-
            A short, machine-readable error code or identifier that categorizes the type of error.
            This field is stable and intended for programmatic handling by clients.
          example: forbidden
        message:
          type: string
          title: Message
          description: >-
            A human-readable summary of the error, suitable for display to end-users or logging.
          example: You are not authorized to access this resource
        details:
          title: Details
          description: >-
            Optional additional context or structured details about the error. Use sparingly and
            avoid including sensitive data.
          type: object
          nullable: true
          additionalProperties: true
          example:
            correlationId: req-abc123-xyz
            timestamp: '2026-01-16T19:22:00Z'
    ProblemDetailErrorLocation:
      title: ProblemDetailErrorLocation
      description: The location on the HTTP request for which a problem has been detected.
      type: string
      enum:
        - body
        - query
        - header
        - path
        - cookie
      example: body
    ProblemDetailErrorItem:
      title: ProblemDetailErrorItem
      description: >-
        Represents a single detailed error within a Problem Details response (RFC 9457). Provides
        granular information about what went wrong in the request.
      type: object
      required:
        - location
        - code
        - message
        - type
      properties:
        location:
          $ref: '#/components/schemas/ProblemDetailErrorLocation'
        code:
          type: string
          title: Code
          description: A machine-readable error code that identifies the specific type of error.
          example: INVALID_REQUEST
        message:
          type: string
          title: Message
          description: A short, human-readable summary of the error.
          example: Invalid request body or parameter
        type:
          type: string
          title: Type
          description: A URI reference or tag that identifies the problem type.
          example: tag:validation-error
        field:
          title: Field
          description: The name of the specific field/property in the request that caused the error.
          type: string
          nullable: true
          example: name
        detail:
          title: Detail
          description: A more detailed human-readable explanation of the error.
          type: string
          nullable: true
          example: name must be a non-empty string up to 200 characters
        received:
          title: Received
          description: The actual value received by the server that caused the error.
          type: string
          nullable: true
          example: ''
        pointer:
          title: Pointer
          description:
            JSON Pointer (RFC 6901) to the exact location of the error within the request body.
          type: string
          nullable: true
          example: '#/name'
        constraints:
          title: Constraints
          description: Optional object containing validation constraint violations.
          type: object
          additionalProperties: true
          nullable: true
          example:
            minLength: 1
            maxLength: 200
      example:
        code: REQUIRED_FIELD_MISSING
        detail: Widget name is required
        field: name
        location: body
        message: Missing required widget name
        pointer: '#/name'
        received: ''
        type: tag:validation-error
    ProblemDetailResponse:
      title: ProblemDetailResponse
      description: Canonical model for problem details as defined by RFC 9457.
      type: object
      required:
        - type
        - title
        - status
        - errors
      properties:
        type:
          type: string
          title: Type
          description: A URI reference that identifies the problem type.
          example: tag:validation-errors
        title:
          type: string
          title: Title
          description: A short, human-readable summary of the problem type.
          example: Bad Request
        status:
          type: integer
          title: Status
          description: A number indicating the HTTP status code generated for this occurrence.
          example: 400
        detail:
          title: Detail
          description: A human-readable explanation specific to this occurrence of the problem.
          type: string
          nullable: true
          example: One or more validation errors occurred
        errors:
          type: array
          minItems: 1
          title: Errors
          description: A list of individual error occurrences with details and locations.
          items:
            $ref: '#/components/schemas/ProblemDetailErrorItem'
      example:
        detail: One or more validation errors occurred
        errors:
          - code: INVALID_REQUEST
            location: body
            message: Invalid request body or parameter
            pointer: '#/name'
            received: ''
            type: tag:validation-error
        status: 400
        title: Bad Request
        type: tag:validation-errors
