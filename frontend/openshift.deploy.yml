apiVersion: template.openshift.io/v1
kind: Template
parameters:
  - name: NAME
    description: Module name
    required: true
  - name: COMPONENT
    description: Component name
    value: frontend
  - name: ZONE
    description: Deployment zone, e.g. pr-### or prod
    required: true
  - name: IMAGE_TAG
    description: Image tag to use
    required: true
  - name: REGISTRY
    description: Container registry to import from
    value: ghcr.io
  - name: ORG_NAME
    description: Organization name
    value: bcgov
  - name: DOMAIN
    value: apps.silver.devops.gov.bc.ca
  - name: MIN_REPLICAS
    description: The minimum amount of replicas for the horizontal pod autoscaler.
    value: "1"
  - name: MAX_REPLICAS
    description: The maximum amount of replicas for the horizontal pod autoscaler.
    value: "5"
  - name: CPU_REQUEST
    value: "25m"
  - name: MEMORY_REQUEST
    value: "50Mi"
  - name: LOG_LEVEL
    description: Caddy log level (debug|info|warn|error)
    value: "info"
  - name: API_BASE_URL
    description: Browser API base URL; may be root-relative or an absolute HTTP(S) URL
    value: "/api/v1"
  - name: OIDC_AUTHORITY
    description: OIDC issuer/authority URL
    required: true
  - name: OIDC_CLIENT_ID
    description: Public OIDC client ID configured for authorization code flow with PKCE
    value: "widget-ui-sdx-reference-implementation-21920"
  - name: OIDC_SCOPE
    description: Space-delimited OIDC scopes requested by the frontend
    value: "openid profile"
  - name: OIDC_DISPLAY_NAME_CLAIM
    description: Dot-delimited ID token claim path used for the signed-in display name
    value: "name"
  - name: OIDC_REDIRECT_URI
    description: OIDC login callback URI; defaults to the frontend origin plus /auth/callback
    value: ""
  - name: OIDC_SILENT_REDIRECT_URI
    description: OIDC silent renewal callback URI; defaults to the frontend origin plus /auth/silent-callback
    value: ""
  - name: OIDC_POST_LOGOUT_REDIRECT_URI
    description: OIDC post-logout URI; defaults to the frontend origin plus /login
    value: ""
objects:
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      labels:
        app: ${NAME}-${ZONE}
      name: ${NAME}-${ZONE}-${COMPONENT}
    spec:
      replicas: 1
      selector:
        matchLabels:
          deployment: ${NAME}-${ZONE}-${COMPONENT}
      strategy:
        type: RollingUpdate
      template:
        metadata:
          labels:
            app: ${NAME}-${ZONE}
            deployment: ${NAME}-${ZONE}-${COMPONENT}
        spec:
          containers:
            - name: ${NAME}
              image: ${REGISTRY}/${ORG_NAME}/${NAME}/${COMPONENT}:${IMAGE_TAG}
              imagePullPolicy: Always
              ports:
                - name: http
                  containerPort: 3000
              env:
                - name: LOG_LEVEL
                  value: ${LOG_LEVEL}
                - name: BACKEND_URL
                  value: http://${NAME}-${ZONE}-backend
                - name: API_BASE_URL
                  value: ${API_BASE_URL}
                - name: OIDC_AUTHORITY
                  value: ${OIDC_AUTHORITY}
                - name: OIDC_CLIENT_ID
                  value: ${OIDC_CLIENT_ID}
                - name: OIDC_SCOPE
                  value: ${OIDC_SCOPE}
                - name: OIDC_DISPLAY_NAME_CLAIM
                  value: ${OIDC_DISPLAY_NAME_CLAIM}
                - name: OIDC_REDIRECT_URI
                  value: ${OIDC_REDIRECT_URI}
                - name: OIDC_SILENT_REDIRECT_URI
                  value: ${OIDC_SILENT_REDIRECT_URI}
                - name: OIDC_POST_LOGOUT_REDIRECT_URI
                  value: ${OIDC_POST_LOGOUT_REDIRECT_URI}
              resources:
                requests:
                  cpu: ${CPU_REQUEST}
                  memory: ${MEMORY_REQUEST}
              readinessProbe:
                httpGet:
                  path: /
                  port: http
              livenessProbe:
                httpGet:
                  path: /
                  port: http
  - apiVersion: v1
    kind: Service
    metadata:
      labels:
        app: ${NAME}-${ZONE}
      name: ${NAME}-${ZONE}-${COMPONENT}
    spec:
      ports:
        - name: http
          port: 80
          targetPort: 3000
      selector:
        deployment: ${NAME}-${ZONE}-${COMPONENT}
  - apiVersion: route.openshift.io/v1
    kind: Route
    metadata:
      labels:
        app: ${NAME}-${ZONE}
      name: ${NAME}-${ZONE}-${COMPONENT}
    spec:
      host: ${NAME}-${ZONE}.${DOMAIN}
      to:
        kind: Service
        name: ${NAME}-${ZONE}-${COMPONENT}
        weight: 100
      tls:
        termination: edge
        insecureEdgeTerminationPolicy: Redirect
  - apiVersion: autoscaling/v2
    kind: HorizontalPodAutoscaler
    metadata:
      labels:
        app: ${NAME}-${ZONE}
      name: ${NAME}-${ZONE}-${COMPONENT}
    spec:
      scaleTargetRef:
        kind: Deployment
        name: ${NAME}-${ZONE}-${COMPONENT}
      minReplicas: ${MIN_REPLICAS}
      maxReplicas: ${MAX_REPLICAS}
      metrics:
        - type: Resource
          resource:
            name: cpu
            target:
              type: Utilization
              averageUtilization: 80
