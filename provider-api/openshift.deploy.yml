apiVersion: template.openshift.io/v1
kind: Template
parameters:
  - name: NAME
    description: Module name
    required: true
  - name: COMPONENT
    description: Component name
    value: provider-api
  - name: ZONE
    description: Deployment zone, e.g. pr-### or prod
    required: true
  - name: IMAGE_TAG
    description: Image tag to use
    required: true
  - name: REGISTRY
    description: Container registry to import from
    value: ghcr.io
  - name: ORG_NAME
    description: Organization name
    value: bcgov
  - name: DOMAIN
    value: apps.silver.devops.gov.bc.ca
  - name: MIN_REPLICAS
    description: The minimum amount of replicas for the horizontal pod autoscaler.
    value: "3"
  - name: MAX_REPLICAS
    description: The maximum amount of replicas for the horizontal pod autoscaler.
    value: "5"
  - name: CPU_REQUEST
    value: "25m"
  - name: MEMORY_REQUEST
    value: "100Mi"
  - name: LOG_LEVEL
    description: Application log level (debug|info|warn|error)
    value: "info"
  - name: OIDC_AUTHORITY
    description: OIDC issuer URL used to derive the OpenID Connect discovery document
    required: true
  - name: OIDC_OPENID_CONNECT_URL
    description: Optional explicit OpenID Connect discovery URL
    value: ""
  - name: PROVIDER_API_SWAGGER_OAUTH_CLIENT_ID
    description: Public OIDC client ID used by Swagger UI with authorization code and PKCE
    value: local-provider-api-swagger
  - name: PROVIDER_API_SWAGGER_OAUTH_REDIRECT_URL
    description: Absolute Swagger UI OAuth callback URL registered with the OIDC client
    required: true
  - name: PROVIDER_API_SWAGGER_OAUTH_SCOPES
    description: Space-delimited OIDC scopes requested by Swagger UI
    value: openid profile nrs:widgets:read nrs:widgets:create nrs:widgets:update nrs:widgets:delete
  - name: PROVIDER_API_ALLOWED_CLIENT_IDS
    description: Comma- or space-delimited service client IDs allowed to call the provider API
    required: true
  - name: PROVIDER_API_JWT_VALIDATE_SIGNATURE
    description: Whether provider-api validates JWT signatures
    value: "true"
  - name: PROVIDER_API_JWT_VALIDATE_EXPIRY
    description: Whether provider-api validates JWT expiry
    value: "true"
objects:
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      labels:
        app: ${NAME}-${ZONE}
      name: ${NAME}-${ZONE}-${COMPONENT}
    spec:
      replicas: 1
      selector:
        matchLabels:
          deployment: ${NAME}-${ZONE}-${COMPONENT}
      strategy:
        type: RollingUpdate
      template:
        metadata:
          labels:
            app: ${NAME}-${ZONE}
            deployment: ${NAME}-${ZONE}-${COMPONENT}
        spec:
          initContainers:
            - name: migrations
              image: ${REGISTRY}/${ORG_NAME}/${NAME}/migrations:${IMAGE_TAG}
              imagePullPolicy: Always
              env:
                - name: POSTGRES_DATABASE
                  valueFrom:
                    secretKeyRef:
                      name: ${NAME}-${ZONE}-database
                      key: database-name
                - name: FLYWAY_URL
                  value: jdbc:postgresql://${NAME}-${ZONE}-database:5432/$(POSTGRES_DATABASE)
                - name: FLYWAY_USER
                  valueFrom:
                    secretKeyRef:
                      name: ${NAME}-${ZONE}-database
                      key: database-user
                - name: FLYWAY_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: ${NAME}-${ZONE}-database
                      key: database-password
                - name: FLYWAY_DEFAULT_SCHEMA
                  value: "widgets"
                - name: FLYWAY_BASELINE_ON_MIGRATE
                  value: "true"
              resources:
                requests:
                  cpu: 10m
                  memory: 50Mi
          containers:
            - name: ${NAME}
              image: ${REGISTRY}/${ORG_NAME}/${NAME}/${COMPONENT}:${IMAGE_TAG}
              imagePullPolicy: Always
              ports:
                - name: http
                  containerPort: 3000
              env:
                - name: NODE_ENV
                  value: production
                - name: LOG_LEVEL
                  value: ${LOG_LEVEL}
                - name: OIDC_AUTHORITY
                  value: ${OIDC_AUTHORITY}
                - name: OIDC_OPENID_CONNECT_URL
                  value: ${OIDC_OPENID_CONNECT_URL}
                - name: SWAGGER_OAUTH_CLIENT_ID
                  value: ${PROVIDER_API_SWAGGER_OAUTH_CLIENT_ID}
                - name: SWAGGER_OAUTH_REDIRECT_URL
                  value: ${PROVIDER_API_SWAGGER_OAUTH_REDIRECT_URL}
                - name: SWAGGER_OAUTH_SCOPES
                  value: ${PROVIDER_API_SWAGGER_OAUTH_SCOPES}
                - name: PROVIDER_API_ALLOWED_CLIENT_IDS
                  value: ${PROVIDER_API_ALLOWED_CLIENT_IDS}
                - name: JWT_ISSUER
                  value: ${OIDC_AUTHORITY}
                - name: JWT_VALIDATE_SIGNATURE
                  value: ${PROVIDER_API_JWT_VALIDATE_SIGNATURE}
                - name: JWT_VALIDATE_EXPIRY
                  value: ${PROVIDER_API_JWT_VALIDATE_EXPIRY}
                - name: POSTGRES_HOST
                  value: ${NAME}-${ZONE}-database
                - name: POSTGRES_PORT
                  value: "5432"
                - name: POSTGRES_DATABASE
                  valueFrom:
                    secretKeyRef:
                      name: ${NAME}-${ZONE}-database
                      key: database-name
                - name: POSTGRES_USER
                  valueFrom:
                    secretKeyRef:
                      name: ${NAME}-${ZONE}-database
                      key: database-user
                - name: POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: ${NAME}-${ZONE}-database
                      key: database-password
                - name: POSTGRES_SCHEMA
                  value: "widgets"
              resources:
                requests:
                  cpu: ${CPU_REQUEST}
                  memory: ${MEMORY_REQUEST}
              readinessProbe:
                httpGet:
                  path: /api/health
                  port: http
              livenessProbe:
                httpGet:
                  path: /api/health
                  port: http
  - apiVersion: v1
    kind: Service
    metadata:
      labels:
        app: ${NAME}-${ZONE}
      name: ${NAME}-${ZONE}-${COMPONENT}
    spec:
      ports:
        - name: http
          port: 80
          targetPort: 3000
      selector:
        deployment: ${NAME}-${ZONE}-${COMPONENT}
  - apiVersion: autoscaling/v2
    kind: HorizontalPodAutoscaler
    metadata:
      labels:
        app: ${NAME}-${ZONE}
      name: ${NAME}-${ZONE}-${COMPONENT}
    spec:
      scaleTargetRef:
        apiVersion: apps/v1
        kind: Deployment
        name: ${NAME}-${ZONE}-${COMPONENT}
      minReplicas: ${MIN_REPLICAS}
      maxReplicas: ${MAX_REPLICAS}
      metrics:
        - type: Resource
          resource:
            name: cpu
            target:
              type: Utilization
              averageUtilization: 80
